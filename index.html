<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя первая страница</title>
    <style>
        /* Немного простых стилей, чтобы было не стыдно показать */
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe4e1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 { color: #333; }
        p { color: #666; line-height: 1.6; }
        .btn {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Привет! Это мой первый лендинг.</h1>
        <p>Я сделал это без конструктора, написав пару строк кода. Здесь мог бы быть ваш текст о продукте или услуге.</p>
        <a href="#" class="btn">Оставить заявку</a>
    </div>

</body>
</html>
